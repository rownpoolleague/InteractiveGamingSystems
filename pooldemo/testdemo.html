<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Main Menu</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/rownpoolleague/InteractiveGamingSystems/pooldemo/main/zzzz.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/rownpoolleague/InteractiveGamingSystems/pooldemo/main/zzzz.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/InteractiveGamingSystems/pooldemo/main/xxxx.png">
<style>
    /* Locks the screen to prevent scrolling */
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: Arial, sans-serif;
    }
    header {
        border-bottom: 1px solid var(--border);
        background-color: var(--bg-primary);
        z-index: 100;
    }
    .demo-intro-text {
        color: #fff;
        text-align: center;
        padding: 10px;
        font-size: 1.1rem;
    }
    .overlay {
        padding: 20px 10px;
        box-sizing: border-box;
    }
    h1 {
        text-align: center;
        color: white;
        margin-bottom: 20px;
        font-size: 32px;
    }
    .menu-container {
        max-width: 500px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .menu-button {
        display: block;
        margin-left: auto;
        margin-right: auto;
        text-align: center;
        padding: 4px;
        background: #1e90ff;
        color: white;
        text-decoration: none;
        font-size: 24px;
        border-radius: 8px;
        font-weight: bold;
        height: 28px;
        width: 250px;
    }
    .nav-container {
        max-width: 1000px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        color: #fff;
    }
    nav a {
        color: var(--text-secondary);
        text-decoration: none;
        margin-left: 20px;
        font-size: 0.95rem;
        font-weight: 500;
    }
    footer { text-align: center; padding: 20px; }
    .footer-logo { max-width: 150px; height: auto; opacity: 0.8; }
    .powered-by {
        display: block;
        margin-top: 10px;
        color: #1e90ff;
        text-decoration: none;
        font-weight: bold;
    }
    .form-wrapper {
        width: 100%; 
        height: 100dvh; 
        border: 4px solid #1e90ff;
        box-sizing: border-box; 
        display: flex;
        flex-direction: column;
    }
    .banner-section { text-align: center; margin: 10px 0; }
    .banner-img {
        width: 100%;
        max-width: 900px;
        max-height: 120px;
        object-fit: contain;
        display: block;
        margin: 0 auto;
    }
</style>
</head>

<body>
<header>
    <div class="banner-section">
        <img src="photos/igsbanner.png" class="banner-img">
    </div>
    <div class="nav-container">
        <nav>
            <a href="https://interactivegamingsystems.app/index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="purchase.html">Purchase</a>
            <a href="#contact">Contact</a>
            <a href="faqs.html">FAQ</a>
            <a href="about.html">About</a>
        </nav>
    </div>
</header>

<div class="form-wrapper">
    <!-- Added text above the app demo -->
    <div class="demo-intro-text">
        Welcome to the 2026 Season Hub. Select an option below to manage league data.
    </div>

    <div class="overlay">
        <h1>Summer 2026</h1>
        <div class="menu-container">
            <a class="menu-button" href="schedule.html">Schedule/Standings</a>
            <a class="menu-button" href="rosters.html">Rosters</a>
            <a class="menu-button" href="scoresheet.html">Keep Score</a>
            <a class="menu-button" href="instructions.html">Scoring Instructions</a>
            <a class="menu-button" href="Lifetime Stats.html">Stats</a>
        </div>
    </div>

    <footer>
        <img src="white transparent.jpg" alt="League Logo" class="footer-logo">
        <a href="https://interactivegamingsystems.app" class="powered-by">&copy; Interactive Gaming Systems LLC</a>
        <a href="news.html" class="powered-by">League & World News</a>
    </footer>
</div>
</body>
</html>
