<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kwikord Game</title>
<style>
    body {
        background: #C23B7A;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
        padding: 20px;
    }

    h1 {
        color: #4CAF50;
        font-size: 48px;
        margin-bottom: 10px;
    }

    #score {
        font-size: 24px;
        margin-bottom: 20px;
    }

    .letter-row {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 15px;
    }

    .letter {
        background: #4CAF50;
        padding: 10px 16px;
        font-size: 24px;
        border-radius: 8px;
        cursor: pointer;
        user-select: none;
        transition: transform 0.1s;
    }

    .letter.selected {
        background: #6BD66A;
        transform: scale(1.15);
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(7, 50px);
        grid-template-rows: repeat(8, 50px);
        gap: 4px;
        justify-content: center;
        margin: 20px auto;
    }

    .cell {
        width: 50px;
        height: 50px;
        background: #ffffff;
        color: #000;
        font-size: 24px;
        border-radius: 4px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        user-select: none;
    }

    .corner {
        background: #ddd;
    }

    button {
        background: #4CAF50;
        border: none;
        padding: 10px 18px;
        font-size: 18px;
        border-radius: 6px;
        cursor: pointer;
        color: white;
        margin: 8px;
    }

    button:hover {
        background: #6BD66A;
    }
</style>
</head>
<body>

<h1>KWIKORD</h1>
<div id="score">Words: 0 | Total Score: 0</div>

<h2>Vowels</h2>
<div id="vowelRow" class="letter-row"></div>

<h2>Consonants</h2>
<div id="consonantRow" class="letter-row"></div>

<div id="grid"></div>

<button onclick="submitWord()">Submit Word</button>
<button onclick="resetGame()">Clear Sheet</button>

<script>
    const ROWS = 8;
    const COLS = 7;

    const VOWELS = ["A","E","I","O","U"];
    const CONSONANTS = ["B","C","D","F","G","H","J","K","L","M","N","P","Q","R","S","T","V","W","X","Y","Z"];

    let selectedLetter = null;
    let lettersPool = [];
    let totalScore = 0;
    let submittedWords = [];
    let newPlacements = [];

    async function checkWordInDictionary(word) {
        const w = word.toLowerCase();
        try {
            const res = await fetch(
                `https://freedictionaryapi.com/api/v1/entries/en/${encodeURIComponent(w)}`
            );
            if (!res.ok) return false;
            const data = await res.json();
            // Valid if we got at least one entry
            return Array.isArray(data.entries) && data.entries.length > 0;
        } catch (e) {
            // If API fails, treat as invalid
            return false;
        }
    }

    function randomLetters() {
        const letters = [];
        for (let i = 0; i < 4; i++) {
            letters.push(VOWELS[Math.floor(Math.random() * VOWELS.length)]);
        }
        for (let i = 0; i < 5; i++) {
            letters.push(CONSONANTS[Math.floor(Math.random() * CONSONANTS.length)]);
        }
        return letters;
    }

    function buildLetters() {
        const vowelRow = document.getElementById("vowelRow");
        const consonantRow = document.getElementById("consonantRow");

        vowelRow.innerHTML = "";
        consonantRow.innerHTML = "";

        lettersPool = randomLetters();

        const vowels = lettersPool.filter(l => VOWELS.includes(l));
        const consonants = lettersPool.filter(l => CONSONANTS.includes(l));

        vowels.forEach((letter) => {
            const div = document.createElement("div");
            div.className = "letter";
            div.textContent = letter;
            div.onclick = () => selectLetter(div, letter);
            vowelRow.appendChild(div);
        });

        consonants.forEach((letter) => {
            const div = document.createElement("div");
            div.className = "letter";
            div.textContent = letter;
            div.onclick = () => selectLetter(div, letter);
            consonantRow.appendChild(div);
        });
    }

    function selectLetter(div, letter) {
        document.querySelectorAll(".letter").forEach(l => l.classList.remove("selected"));
        div.classList.add("selected");
        selectedLetter = letter;
    }

    function buildGrid() {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.dataset.row = r;
                cell.dataset.col = c;

                if ((r === 0 && c === 0) || (r === 0 && c === COLS-1) ||
                    (r === ROWS-1 && c === 0) || (r === ROWS-1 && c === COLS-1)) {
                    cell.classList.add("corner");
                }

                cell.onclick = () => {
                    if (cell.textContent) {
                        cell.textContent = "";
                        newPlacements = newPlacements.filter(p => !(p.row == r && p.col == c));
                        return;
                    }

                    if (selectedLetter) {
                        cell.textContent = selectedLetter;
                        newPlacements.push({ row: r, col: c });
                    }
                };

                grid.appendChild(cell);
            }
        }
    }

    function resetGame() {
        buildLetters();
        buildGrid();
        selectedLetter = null;
        submittedWords = [];
        newPlacements = [];
        totalScore = 0;
        document.getElementById("score").textContent =
            "Words: 0 | Total Score: 0";
    }

    function getGridArray() {
        const gridArray = [];
        for (let r = 0; r < ROWS; r++) {
            const row = [];
            for (let c = 0; c < COLS; c++) {
                const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
                row.push(cell.textContent || "");
            }
            gridArray.push(row);
        }
        return gridArray;
    }

    async function submitWord() {
        if (newPlacements.length === 0) {
            alert("Place letters to form a word first.");
            return;
        }

        const grid = getGridArray();

        const sameRow = newPlacements.every(p => p.row === newPlacements[0].row);
        const sameCol = newPlacements.every(p => p.col === newPlacements[0].col);

        if (!sameRow && !sameCol) {
            alert("Letters must form a straight line.");
            return;
        }

        let word = "";

        if (sameRow) {
            const row = newPlacements[0].row;
            let cols = newPlacements.map(p => p.col).sort((a,b)=>a-b);

            let c = cols[0];

            while (c > 0 && grid[row][c - 1] !== "") {
                c--;
            }

            while (c < COLS && grid[row][c] !== "") {
                word += grid[row][c];
                c++;
            }

        } else {
            const col = newPlacements[0].col;
            let rows = newPlacements.map(p => p.row).sort((a,b)=>a-b);

            let r = rows[0];

            while (r > 0 && grid[r - 1][col] !== "") {
                r--;
            }

            while (r < ROWS && grid[r][col] !== "") {
                word += grid[r][col];
                r++;
            }
        }

        const isValid = await checkWordInDictionary(word);

        if (!isValid) {
            alert("Invalid word: " + word);
            return;
        }

        if (submittedWords.includes(word)) {
            alert("Word already submitted.");
            return;
        }

        submittedWords.push(word);
        totalScore += 1;

        document.getElementById("score").textContent =
            "Words: " + submittedWords.length + " | Total Score: " + totalScore;

        alert("Valid word: " + word + "\nTotal Score: " + totalScore);

        newPlacements = [];
    }

    buildLetters();
    buildGrid();
</script>

</body>
</html>
