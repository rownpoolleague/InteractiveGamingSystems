<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kwikord Game</title>
<style>
    body {
        background: #C23B7A;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
        padding: 20px;
    }

    h1 {
        color: #4CAF50;
        font-size: 48px;
        margin-bottom: 10px;
    }

    #score {
        font-size: 24px;
        margin-bottom: 20px;
    }

    .letter-row {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 15px;
    }

    .letter {
        background: #4CAF50;
        padding: 10px 16px;
        font-size: 24px;
        border-radius: 8px;
        cursor: pointer;
        user-select: none;
        transition: transform 0.1s;
    }

    .letter.selected {
        background: #6BD66A;
        transform: scale(1.15);
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(7, 50px);
        grid-template-rows: repeat(8, 50px);
        gap: 4px;
        justify-content: center;
        margin: 20px auto;
    }

    .cell {
        width: 50px;
        height: 50px;
        background: #ffffff;
        color: #000;
        font-size: 24px;
        border-radius: 4px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        user-select: none;
    }

    .corner {
        background: #ddd;
    }

    button {
        background: #4CAF50;
        border: none;
        padding: 10px 18px;
        font-size: 18px;
        border-radius: 6px;
        cursor: pointer;
        color: white;
        margin: 8px;
    }

    button:hover {
        background: #6BD66A;
    }
</style>
</head>
<body>

<h1>KWIKORD</h1>
<div id="score">Words: 0 | Total Score: 0</div>



<div id="grid"></div>
<h2>Vowels</h2>
<div id="vowelRow" class="letter-row"></div>

<h2>Consonants</h2>
<div id="consonantRow" class="letter-row"></div>
<button onclick="submitWord()">Submit Word</button>
<button onclick="resetGame()">Clear Sheet</button>
<button id="submitTotalBtn">Submit Score</button>


<script>
    let currentUser = "mike"; // temporary until login page is built

    const ROWS = 8;
    const COLS = 7;

    const VOWELS = ["A","E","I","O","U"];
    const CONSONANTS = ["B","C","D","F","G","H","J","K","L","M","N","P","Q","R","S","T","V","W","X","Y","Z"];

    let selectedLetter = null;
    let lettersPool = [];
    let totalScore = 0;
    let submittedWords = [];
    let newPlacements = [];

    async function checkWordInDictionary(word) {
        const w = word.toLowerCase();
        try {
            const res = await fetch(
                `https://freedictionaryapi.com/api/v1/entries/en/${encodeURIComponent(w)}`
            );
            if (!res.ok) return false;
            const data = await res.json();
            return Array.isArray(data.entries) && data.entries.length > 0;
        } catch (e) {
            return false;
        }
    }

    async function validateAllWords(grid, newPlacements, mainWord, sameRow, sameCol) {
        let wordsToCheck = [];

        // MAIN WORD (only if length > 1)
        if (mainWord.length > 1) {
            wordsToCheck.push(mainWord);
        }

        // CROSS WORDS
        for (let p of newPlacements) {
            let r = p.row;
            let c = p.col;
            let word = "";

            if (sameRow) {
                // vertical cross-word
                let rr = r;
                while (rr > 0 && grid[rr - 1][c] !== "") rr--;
                while (rr < ROWS && grid[rr][c] !== "") {
                    word += grid[rr][c];
                    rr++;
                }
            } else {
                // horizontal cross-word
                let cc = c;
                while (cc > 0 && grid[r][cc - 1] !== "") cc--;
                while (cc < COLS && grid[r][cc] !== "") {
                    word += grid[r][cc];
                    cc++;
                }
            }

            if (word.length > 1) {
                wordsToCheck.push(word);
            }
        }

        // If NO multi-letter words exist → invalid move
        if (wordsToCheck.length === 0) {
            return { valid: false, badWord: "(single letters only)" };
        }

        // Validate all words
        for (let w of wordsToCheck) {
            const valid = await checkWordInDictionary(w);
            if (!valid) {
                return { valid: false, badWord: w };
            }
        }

        return { valid: true, words: wordsToCheck };
    }

    function randomLetters() {
        const letters = [];
        for (let i = 0; i < 4; i++) {
            letters.push(VOWELS[Math.floor(Math.random() * VOWELS.length)]);
        }
        for (let i = 0; i < 5; i++) {
            letters.push(CONSONANTS[Math.floor(Math.random() * CONSONANTS.length)]);
        }
        return letters;
    }

    function buildLetters() {
        const vowelRow = document.getElementById("vowelRow");
        const consonantRow = document.getElementById("consonantRow");

        vowelRow.innerHTML = "";
        consonantRow.innerHTML = "";

        lettersPool = randomLetters();

        const vowels = lettersPool.filter(l => VOWELS.includes(l));
        const consonants = lettersPool.filter(l => CONSONANTS.includes(l));

        vowels.forEach((letter) => {
            const div = document.createElement("div");
            div.className = "letter";
            div.textContent = letter;
            div.onclick = () => selectLetter(div, letter);
            vowelRow.appendChild(div);
        });

        consonants.forEach((letter) => {
            const div = document.createElement("div");
            div.className = "letter";
            div.textContent = letter;
            div.onclick = () => selectLetter(div, letter);
            consonantRow.appendChild(div);
        });
    }

    function selectLetter(div, letter) {
        document.querySelectorAll(".letter").forEach(l => l.classList.remove("selected"));
        div.classList.add("selected");
        selectedLetter = letter;
    }

    function buildGrid() {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.dataset.locked = "false";

                if ((r === 0 && c === 0) || (r === 0 && c === COLS-1) ||
                    (r === ROWS-1 && c === 0) || (r === ROWS-1 && c === COLS-1)) {
                    cell.classList.add("corner");
                }

                cell.onclick = () => {
                    if (cell.dataset.locked === "true") return;

                if (cell.textContent) {

    // Restore cleared letter back to the letter pool
    const letter = cell.textContent;
    const rowDiv = VOWELS.includes(letter)
        ? document.getElementById("vowelRow")
        : document.getElementById("consonantRow");

    const div = document.createElement("div");
    div.className = "letter";
    div.textContent = letter;
    div.onclick = () => selectLetter(div, letter);
    rowDiv.appendChild(div);

    // Clear the cell
    cell.textContent = "";

    // Remove from newPlacements
    newPlacements = newPlacements.filter(p => !(p.row == r && p.col == c));

    return;
}


               if (selectedLetter) {
    cell.textContent = selectedLetter;
    newPlacements.push({ row: r, col: c });

    // REMOVE the used letter tile from the letter row
    const tile = document.querySelector(`.letter.selected`);
    if (tile) tile.remove();

    // Clear selectedLetter so user must pick a new tile
    selectedLetter = null;
}

                };

                grid.appendChild(cell);
            }
        }
    }

    function resetGame() {
        document.querySelectorAll(".cell").forEach(c => c.dataset.locked = "false");
        buildLetters();
        buildGrid();
        selectedLetter = null;
        submittedWords = [];
        newPlacements = [];
        totalScore = 0;
        document.getElementById("score").textContent =
            "Words: 0 | Total Score: 0";
    }

    function getGridArray() {
        const gridArray = [];
        for (let r = 0; r < ROWS; r++) {
            const row = [];
            for (let c = 0; c < COLS; c++) {
                const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
                row.push(cell.textContent || "");
            }
            gridArray.push(row);
        }
        return gridArray;
    }

async function submitWord() {
    if (newPlacements.length === 0) {
        alert("Place letters to form a word first.");
        return;
    }

    const grid = getGridArray();

    const sameRow = newPlacements.every(p => p.row === newPlacements[0].row);
    const sameCol = newPlacements.every(p => p.col === newPlacements[0].col);

    if (!sameRow && !sameCol) {
        alert("Letters must form a straight line.");
        return;
    }

    let word = "";

    if (sameRow) {
        const row = newPlacements[0].row;
        let cols = newPlacements.map(p => p.col).sort((a,b)=>a-b);

        let c = cols[0];
        while (c > 0 && grid[row][c - 1] !== "") c--;
        while (c < COLS && grid[row][c] !== "") {
            word += grid[row][c];
            c++;
        }

    } else {
        const col = newPlacements[0].col;
        let rows = newPlacements.map(p => p.row).sort((a,b)=>a-b);

        let r = rows[0];
        while (r > 0 && grid[r - 1][col] !== "") r--;
        while (r < ROWS && grid[r][col] !== "") {
            word += grid[r][col];
            r++;
        }
    }

    // SCRABBLE VALIDATION (main + cross words)
    const result = await validateAllWords(grid, newPlacements, word, sameRow, sameCol);

    if (!result.valid) {
        alert("Invalid word found: " + result.badWord);
        return;
    }

    // Count corners
    let cornersFilled = 0;
    const cornerCoords = [
        {r:0, c:0},
        {r:0, c:COLS-1},
        {r:ROWS-1, c:0},
        {r:ROWS-1, c:COLS-1}
    ];

    cornerCoords.forEach(corner => {
        if (grid[corner.r][corner.c] !== "") {
            cornersFilled++;
        }
    });

    let multiplier = Math.max(1, cornersFilled);

    // Add ALL words formed (main + cross)
    submittedWords.push(...result.words);

    // LOCK placed letters
    newPlacements.forEach(p => {
        const cell = document.querySelector(`.cell[data-row="${p.row}"][data-col="${p.col}"]`);
        cell.dataset.locked = "true";
    });

    // RESTORE used letters back to the letter pool
    newPlacements.forEach(p => {
        const letter = grid[p.row][p.col];
        const rowDiv = VOWELS.includes(letter)
            ? document.getElementById("vowelRow")
            : document.getElementById("consonantRow");

        const div = document.createElement("div");
        div.className = "letter";
        div.textContent = letter;
        div.onclick = () => selectLetter(div, letter);
        rowDiv.appendChild(div);
    });

    // Score = total words × multiplier
    totalScore = submittedWords.length * multiplier;
    document.getElementById("score").textContent =
        "Words: " + submittedWords.length + " | Total Score: " + totalScore;

    alert(
        "Valid words: " + result.words.join(", ") +
        "\nCorners filled: " + cornersFilled +
        "\nMultiplier: x" + multiplier +
        "\nNew Total Score: " + totalScore
    );

    newPlacements = [];
}


    buildLetters();
    buildGrid();
    async function sendScoreToServer(username, score) {
    const url = "https://script.google.com/macros/s/AKfycby-Tr_htGg8czKorbiE6UKCgfUgIPpwpyXE1MKrBCTYu1EMLzD0LdeBIBfC1EzxDl8v/exec";

    try {
        const res = await fetch(url, {
            method: "POST",
            body: JSON.stringify({
                action: "submitScore",
                username: username,
                score: score
            })
        });

        const data = await res.json();

        if (!data.ok) {
            console.log("Score submission failed:", data);
        } else {
            console.log("Score submitted successfully");
        }

    } catch (err) {
        console.log("Error sending score:", err);
    }
}
document.getElementById("submitTotalBtn").onclick = () => {
    sendScoreToServer(currentUser, totalScore);
    alert("Total score submitted!");
};

</script>



</body>
</html>
