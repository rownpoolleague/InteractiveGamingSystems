<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kwikord Game</title>
    <style>
        body {
        background: #C23B7A;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
        padding: 10px; /* Reduced padding */
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overscroll-behavior: none;
    }

        h1 {
        color: #4CAF50;
        font-size: 32px; /* Smaller font for mobile */
        margin: 5px 0;
    }

        #score {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .letter-row {
        display: flex;
        justify-content: center;
        gap: 5px;
        margin-bottom: 8px;
        flex-wrap: wrap; /* Allows letters to wrap if the row is full */
    }

    .letter {
        background: #4CAF50;
        padding: 8px 12px;
        font-size: 18px;
        border-radius: 6px;
        cursor: pointer;
        user-select: none;
        touch-action: none;
    }

        .letter.selected {
            background: #6BD66A;
            transform: scale(1.15);
        }

        #grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        grid-template-rows: repeat(8, 1fr);
        gap: 3px;
        width: 95vw;
        max-width: 400px; /* Keeps it from getting too big on tablets */
        aspect-ratio: 7 / 8; /* Forces the grid to maintain its shape */
        margin: 5px auto;
    }

        .cell {
        aspect-ratio: 1 / 1;
        background: #ffffff;
        color: #000;
        font-size: 14px; /* Scaled down for cells */
        border-radius: 4px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
    }

        .corner {
            background: #ddd;
        }
        /* Add to your <style> block */
.letter {
    background: #4CAF50;
    padding: 10px 16px;
    font-size: 24px;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.1s;
    touch-action: none; 
}

.cell.drag-over {
    background: #e0e0e0; /* Visual feedback when dragging over a cell */
}

        button {
        background: #4CAF50;
        border: none;
        padding: 8px 12px;
        font-size: 16px;
        border-radius: 6px;
        color: white;
        margin: 4px;
    }

        button:hover {
            background: #6BD66A;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            background: #C23B7A;
            color: white;
            width: 320px;
            padding: 20px;
            margin: 15% auto;
            border-radius: 10px;
            text-align: center;
        }

        .modal-content input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: none;
        }

        .modal-content button {
            background: #4CAF50;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .tab-row {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .tab {
            background: #8A2555;
            border: none;
            color: white;
            padding: 6px 12px;
            margin: 0 4px;
            border-radius: 5px;
            cursor: pointer;
        }

        .tab.active {
            background: #4CAF50;
        }
        #toast-container {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
}

.toast {
    background: #333;
    color: #fff;
    padding: 12px 24px;
    margin-bottom: 10px;
    border-radius: 5px;
    opacity: 0;
    transition: opacity 0.5s ease;
}

.toast.show {
    opacity: 1;
}
    </style>
</head>

<body>
  
    <!-- Add this to your body -->
<div id="toast-container"></div>
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>Kwikord</h2>

            <div class="tab-row">
                <button id="tabLogin" class="tab active">Login</button>
                <button id="tabCreate" class="tab">Create Account</button>
            </div>

            <div id="loginSection">
                <input id="loginUser" type="text" placeholder="Username">
                <input id="loginPass" type="password" placeholder="Password">
                <button id="loginBtn">Login</button>
                <p id="loginMsg"></p>
            </div>

            <div id="createSection" style="display:none;">
                <input id="createUser" type="text" placeholder="Desired username">
                <input id="createPass1" type="password" placeholder="Password">
                <input id="createPass2" type="password" placeholder="Confirm password">
                <button id="createBtn">Create Account</button>
                <p id="createMsg"></p>
            </div>
        </div>
    </div>


    <h1>KWIKORD</h1>

    <div id="highestScoreBox">
        Highest Score: <span id="highestScoreValue">Loading...</span>
    </div>

    <div id="grid"></div>
    <div id="score">Words: 0 | Total Score: 0</div>

    <div id="vowelRow" class="letter-row"></div>


    <div id="consonantRow" class="letter-row"></div>
    <button onclick="submitWord()">Submit Word</button>
    <button id="submitTotalBtn">Submit Score</button>
<br><button onclick="resetGame()">Reset Game</button>

<script>
    let currentUser = null;
    const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbx6ZWBLgg-bOImm2Uu3F0CzHleKwtiYe4hAtY9HwO-CkiSgV0i6Ol-mgRMaOJazIxLh/exec";
    const ROWS = 8;
    const COLS = 7;
    const VOWELS = ["A", "E", "I", "O", "U"];
    const CONSONANTS = ["B", "C", "D", "F", "G", "H", "J", "K", "L", "M", "N", "P", "Q", "R", "S", "T", "V", "W", "X", "Y", "Z"];

    let selectedLetter = null;
    let lettersPool = [];
    let totalScore = 0;
    let submittedWords = [];
    let newPlacements = [];

    // --- MOBILE TOUCH DRAG LOGIC ---
    let draggedEl = null;
    let offsetX = 0;
    let offsetY = 0;

    function initTouchDrag(el, letter) {
        el.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            draggedEl = el.cloneNode(true);
            draggedEl.style.position = 'fixed';
            draggedEl.style.zIndex = '10000';
            draggedEl.style.pointerEvents = 'none';
            draggedEl.style.opacity = '0.8';
            document.body.appendChild(draggedEl);
            
            offsetX = touch.clientX - el.getBoundingClientRect().left;
            offsetY = touch.clientY - el.getBoundingClientRect().top;
            
            draggedEl.style.left = (touch.clientX - offsetX) + 'px';
            draggedEl.style.top = (touch.clientY - offsetY) + 'px';
        });

        el.addEventListener('touchmove', (e) => {
            if (!draggedEl) return;
            const touch = e.touches[0];
            draggedEl.style.left = (touch.clientX - offsetX) + 'px';
            draggedEl.style.top = (touch.clientY - offsetY) + 'px';
            e.preventDefault();
        }, { passive: false });

        el.addEventListener('touchend', (e) => {
            if (!draggedEl) return;
            const touch = e.changedTouches[0];
            const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            const cell = elemBelow ? elemBelow.closest('.cell') : null;

            if (cell && cell.dataset.locked === "false" && !cell.textContent) {
                cell.textContent = letter;
                newPlacements.push({ row: parseInt(cell.dataset.row), col: parseInt(cell.dataset.col) });
                el.remove();
            }
            draggedEl.remove();
            draggedEl = null;
        });
    }

    // --- EXISTING GAME LOGIC ---
    async function checkWordInDictionary(word) {
        const w = word.toLowerCase();
        try {
            const res = await fetch(`https://freedictionaryapi.com/api/v1/entries/en/${encodeURIComponent(w)}`);
            if (!res.ok) return false;
            const data = await res.json();
            return Array.isArray(data.entries) && data.entries.length > 0;
        } catch (e) { return false; }
    }

    async function validateAllWords(grid, newPlacements, mainWord, sameRow, sameCol) {
        let wordsToCheck = [];
        if (mainWord.length > 1) wordsToCheck.push(mainWord);
        for (let p of newPlacements) {
            let r = p.row, c = p.col, word = "";
            if (sameRow) {
                let rr = r;
                while (rr > 0 && grid[rr - 1][c] !== "") rr--;
                while (rr < ROWS && grid[rr][c] !== "") { word += grid[rr][c]; rr++; }
            } else {
                let cc = c;
                while (cc > 0 && grid[r][cc - 1] !== "") cc--;
                while (cc < COLS && grid[r][cc] !== "") { word += grid[r][cc]; cc++; }
            }
            if (word.length > 1) wordsToCheck.push(word);
        }
        if (wordsToCheck.length === 0) return { valid: false, badWord: "(single letters only)" };
        for (let w of wordsToCheck) {
            if (!(await checkWordInDictionary(w))) return { valid: false, badWord: w };
        }
        return { valid: true, words: wordsToCheck };
    }

    function randomLetters() {
        const letters = [];
        for (let i = 0; i < 4; i++) letters.push(VOWELS[Math.floor(Math.random() * VOWELS.length)]);
        for (let i = 0; i < 5; i++) letters.push(CONSONANTS[Math.floor(Math.random() * CONSONANTS.length)]);
        return letters;
    }

    function buildLetters() {
        const vowelRow = document.getElementById("vowelRow");
        const consonantRow = document.getElementById("consonantRow");
        vowelRow.innerHTML = ""; consonantRow.innerHTML = "";
        lettersPool = randomLetters();

        const createLetterDiv = (letter) => {
            const div = document.createElement("div");
            div.className = "letter";
            div.textContent = letter;
            div.draggable = true;
            div.ondragstart = (e) => {
                e.dataTransfer.setData("text/plain", letter);
                selectLetter(div, letter);
            };
            div.onclick = () => selectLetter(div, letter);
            initTouchDrag(div, letter);
            return div;
        };

        lettersPool.filter(l => VOWELS.includes(l)).forEach(l => vowelRow.appendChild(createLetterDiv(l)));
        lettersPool.filter(l => CONSONANTS.includes(l)).forEach(l => consonantRow.appendChild(createLetterDiv(l)));
    }

    function selectLetter(div, letter) {
        document.querySelectorAll(".letter").forEach(l => l.classList.remove("selected"));
        div.classList.add("selected");
        selectedLetter = letter;
    }

    function buildGrid() {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.dataset.locked = "false";
                if ((r === 0 && c === 0) || (r === 0 && c === COLS - 1) || (r === ROWS - 1 && c === 0) || (r === ROWS - 1 && c === COLS - 1)) cell.classList.add("corner");
                
                cell.ondragover = (e) => { if (cell.dataset.locked === "false" && !cell.textContent) e.preventDefault(); };
                cell.ondrop = (e) => {
                    e.preventDefault();
                    if (cell.dataset.locked === "false" && !cell.textContent) {
                        cell.textContent = e.dataTransfer.getData("text/plain");
                        newPlacements.push({ row: r, col: c });
                        const tile = document.querySelector(`.letter.selected`);
                        if (tile) tile.remove();
                    }
                };
                cell.onclick = () => {
                    if (cell.dataset.locked === "true" || !cell.textContent) return;
                    const letter = cell.textContent;
                    const rowDiv = VOWELS.includes(letter) ? document.getElementById("vowelRow") : document.getElementById("consonantRow");
                    const div = document.createElement("div");
                    div.className = "letter";
                    div.textContent = letter;
                    div.draggable = true;
                    div.ondragstart = (e) => { e.dataTransfer.setData("text/plain", letter); selectLetter(div, letter); };
                    div.onclick = () => selectLetter(div, letter);
                    initTouchDrag(div, letter);
                    rowDiv.appendChild(div);
                    cell.textContent = "";
                    newPlacements = newPlacements.filter(p => !(p.row == r && p.col == c));
                };
                grid.appendChild(cell);
            }
        }
    }

    function resetGame() {
        document.querySelectorAll(".cell").forEach(c => c.dataset.locked = "false");
        buildLetters();
        buildGrid();
        selectedLetter = null;
        submittedWords = [];
        newPlacements = [];
        totalScore = 0;
        document.getElementById("score").textContent = "Words: 0 | Total Score: 0";
    }

    function getGridArray() {
        const gridArray = [];
        for (let r = 0; r < ROWS; r++) {
            const row = [];
            for (let c = 0; c < COLS; c++) {
                const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
                row.push(cell.textContent || "");
            }
            gridArray.push(row);
        }
        return gridArray;
    }

    async function submitWord() {
        if (newPlacements.length === 0) { showToast("Place letters to form a word first."); return; }
        const grid = getGridArray();
        const sameRow = newPlacements.every(p => p.row === newPlacements[0].row);
        const sameCol = newPlacements.every(p => p.col === newPlacements[0].col);
        if (!sameRow && !sameCol) { showToast("Letters must form a straight line."); return; }
        let word = "";
        if (sameRow) {
            const row = newPlacements[0].row;
            let cols = newPlacements.map(p => p.col).sort((a, b) => a - b);
            let c = cols[0];
            while (c > 0 && grid[row][c - 1] !== "") c--;
            while (c < COLS && grid[row][c] !== "") { word += grid[row][c]; c++; }
        } else {
            const col = newPlacements[0].col;
            let rows = newPlacements.map(p => p.row).sort((a, b) => a - b);
            let r = rows[0];
            while (r > 0 && grid[r - 1][col] !== "") r--;
            while (r < ROWS && grid[r][col] !== "") { word += grid[r][col]; r++; }
        }
        const result = await validateAllWords(grid, newPlacements, word, sameRow, sameCol);
        if (!result.valid) { showToast("Invalid word found: " + result.badWord); return; }
        const duplicates = result.words.filter(w => submittedWords.includes(w));
        if (duplicates.length > 0) { showToast("Duplicate word(s) not allowed: " + duplicates.join(", ")); return; }
        let cornersFilled = 0;
        [{r: 0, c: 0}, {r: 0, c: COLS - 1}, {r: ROWS - 1, c: 0}, {r: ROWS - 1, c: COLS - 1}].forEach(corner => { if (grid[corner.r][corner.c] !== "") cornersFilled++; });
        let multiplier = Math.max(1, cornersFilled);
        submittedWords.push(...result.words);
        newPlacements.forEach(p => { document.querySelector(`.cell[data-row="${p.row}"][data-col="${p.col}"]`).dataset.locked = "true"; });
        newPlacements.forEach(p => {
            const letter = grid[p.row][p.col];
            const rowDiv = VOWELS.includes(letter) ? document.getElementById("vowelRow") : document.getElementById("consonantRow");
            const div = document.createElement("div");
            div.className = "letter";
            div.textContent = letter;
            div.draggable = true;
            div.ondragstart = (e) => { e.dataTransfer.setData("text/plain", letter); selectLetter(div, letter); };
            div.onclick = () => selectLetter(div, letter);
            initTouchDrag(div, letter);
            rowDiv.appendChild(div);
        });
        totalScore = submittedWords.length * multiplier;
        document.getElementById("score").textContent = "Words: " + submittedWords.length + " | Total Score: " + totalScore;
        showToast("Valid words: " + result.words.join(", ") + " | Score: " + totalScore);
        newPlacements = [];
    }

    async function sendScoreToServer(username, score) {
        try {
            await fetch("https://script.google.com/macros/s/AKfycbzsNGoOe-EsJslbJzgm6E7z60f8dHBwhHyXSoJj_GuC5nkTtjIHwXBdWZJj7bDmF0ZM/exec", {
                method: "POST",
                body: JSON.stringify({ action: "submitScore", username: username, score: score })
            });
        } catch (err) { console.log(err); }
    }

    document.getElementById("submitTotalBtn").onclick = () => { sendScoreToServer(currentUser, totalScore); alert("Total score submitted!"); resetGame(); };

    function showToast(message, duration = 3000) {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add("show"), 10);
        setTimeout(() => { toast.classList.remove("show"); setTimeout(() => toast.remove(), 500); }, duration);
    }

    async function loadHighestScore() {
        try {
            const res = await fetch("https://script.google.com/macros/s/AKfycbzsNGoOe-EsJslbJzgm6E7z60f8dHBwhHyXSoJj_GuC5nkTtjIHwXBdWZJj7bDmF0ZM/exec?action=getHighestScore");
            const data = await res.json();
            if (data.ok && data.username) document.getElementById("highestScoreValue").textContent = `${data.username} ${data.score}`;
            else document.getElementById("highestScoreValue").textContent = "No scores yet";
        } catch (err) { document.getElementById("highestScoreValue").textContent = "Error loading score"; }
    }
    loadHighestScore();

    function openLoginModal() { document.getElementById("loginModal").style.display = "block"; }
    function closeLoginModal() { document.getElementById("loginModal").style.display = "none"; }
    document.getElementById("tabLogin").onclick = () => { document.getElementById("loginSection").style.display = "block"; document.getElementById("createSection").style.display = "none"; document.getElementById("tabLogin").classList.add("active"); document.getElementById("tabCreate").classList.remove("active"); };
    document.getElementById("tabCreate").onclick = () => { document.getElementById("loginSection").style.display = "none"; document.getElementById("createSection").style.display = "block"; document.getElementById("tabCreate").classList.add("active"); document.getElementById("tabLogin").classList.remove("active"); };
    document.getElementById("loginBtn").onclick = async () => {
        const username = document.getElementById("loginUser").value;
        const password = document.getElementById("loginPass").value;
        const res = await fetch(APPSCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "loginUser", username: username, password: password }) });
        const data = await res.json();
        if (data.ok) { currentUser = username; document.getElementById("loginMsg").textContent = "Login successful!"; setTimeout(() => closeLoginModal(), 800); }
        else { document.getElementById("loginMsg").textContent = data.message || "Invalid login."; }
    };
    document.getElementById("createBtn").onclick = async () => {
        const username = document.getElementById("createUser").value;
        const pass1 = document.getElementById("createPass1").value;
        const pass2 = document.getElementById("createPass2").value;
        if (!username || !pass1 || !pass2) { document.getElementById("createMsg").textContent = "Fill in all fields."; return; }
        if (pass1 !== pass2) { document.getElementById("createMsg").textContent = "Passwords do not match."; return; }
        const res = await fetch(APPSCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "createAccount", username: username, password: pass1 }) });
        const data = await res.json();
        document.getElementById("createMsg").textContent = data.message;
        if (data.ok) { document.getElementById("loginUser").value = username; document.getElementById("tabLogin").click(); }
    };
    window.onclick = function(event) { if (event.target === document.getElementById("loginModal")) closeLoginModal(); };
    buildLetters();
    buildGrid();
    openLoginModal();
</script>


</body>

</html>
