<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Interactive Chess Puzzles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #262522;
            color: #bababa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 450px; width: 100%; text-align: center; }
        h1 { color: #81b64c; margin-bottom: 5px; font-size: 2rem; }
        #status {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 15px 0;
            min-height: 28px;
            color: #ffd700;
        }
        #board {
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border-radius: 4px;
            overflow: hidden;
        }
        .btn {
            background-color: #81b64c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #a3d16c; }
    </style>
</head>
<body>

<div class="container">
    <h1>Live Tactic Trainer</h1>
    <div id="status">Bypassing CORS restrictions...</div>
    
    <div id="board"></div>
    
    <button class="btn" onclick="fetchLivePuzzle()">Next Random Puzzle</button>
</div>

<!-- Dependencies -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>
let board = null;
let game = new Chess();
let puzzleLines = [];
let stepIndex = 0;

async function fetchLivePuzzle() {
    document.getElementById('status').innerText = "Fetching fresh puzzle data...";
    document.getElementById('status').style.color = "#ffd700";
    
    // We append a public open proxy string to allow cross-origin requests from our raw desktop HTML file
    const proxyUrl = "https://cors-anywhere.herokuapp.com/";
    const targetUrl = "https://lichess.org/api/puzzle/next";
    
    try {
        const response = await fetch(proxyUrl + targetUrl);
        if (!response.ok) throw new Error("Proxy error or rate-limited.");
        
        const data = await response.json();
        
        const initialFen = data.game.fen;
        const initialLines = data.puzzle.lines;
        
        game.load(initialFen);
        stepIndex = 0;
        
        // 1. Process the very first opponent blunder key
        const setupMoveUCI = Object.keys(initialLines)[0];
        game.move({
            from: setupMoveUCI.substring(0, 2),
            to: setupMoveUCI.substring(2, 4),
            promotion: setupMoveUCI.length === 5 ? setupMoveUCI.charAt(4) : undefined
        });
        
        // 2. Flatten the rest of the target solution sequence into an array
        puzzleLines = flattenLines(initialLines[setupMoveUCI]);
        
        // 3. Set up the display config
        const config = {
            position: game.fen(),
            draggable: true,
            orientation: game.turn() === 'w' ? 'white' : 'black',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        
        board = ChessBoard('board', config);
        document.getElementById('status').innerText = "Your turn! Find the winning move.";
        document.getElementById('status').style.color = "#81b64c";

    } catch (error) {
        console.error(error);
        document.getElementById('status').innerText = "Click button below to authorize free temporary proxy access.";
        document.getElementById('status').style.color = "#fa4c4c";
        
        // Add a helpful fallback button if the proxy needs them to hit the opt-in button
        if(!document.getElementById('proxy-btn')) {
            const container = document.querySelector('.container');
            const authBtn = document.createElement('a');
            authBtn.id = 'proxy-btn';
            authBtn.href = 'https://cors-anywhere.herokuapp.com/corsdemo';
            authBtn.target = '_blank';
            authBtn.innerText = "Click Here to Activate Demo Proxy (Then refresh)";
            authBtn.className = 'btn';
            authBtn.style.backgroundColor = '#d1ac00';
            authBtn.style.display = 'block';
            container.appendChild(authBtn);
        }
    }
}

function onDragStart(source, piece, position, orientation) {
    if (game.game_over() || stepIndex >= puzzleLines.length) return false;
    if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
        (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
    }
}

function onDrop(source, target) {
    const attemptedMove = source + target;
    const correctMove = puzzleLines[stepIndex];

    if (attemptedMove !== correctMove && (attemptedMove + 'q') !== correctMove) {
        document.getElementById('status').innerText = "Wrong move! Recalculate.";
        document.getElementById('status').style.color = "#fa4c4c";
        return 'snapback';
    }

    game.move({ from: source, to: target, promotion: 'q' });
    stepIndex++;

    if (stepIndex < puzzleLines.length) {
        const computerMove = puzzleLines[stepIndex];
        setTimeout(() => {
            game.move({
                from: computerMove.substring(0, 2),
                to: computerMove.substring(2, 4),
                promotion: computerMove.length === 5 ? computerMove.charAt(4) : undefined
            });
            board.position(game.fen());
            stepIndex++;
            document.getElementById('status').innerText = "They responded! Next move?";
            document.getElementById('status').style.color = "#ffd700";
        }, 400);
    } else {
        document.getElementById('status').innerText = "Puzzle Solved successfully!";
        document.getElementById('status').style.color = "#81b64c";
    }
}

function onSnapEnd() {
    board.position(game.fen());
}

// Helper to convert Lichess solution object tree into a straight sequence array
function flattenLines(node) {
    let result = [];
    while (node) {
        if (Array.isArray(node)) {
            result.push(node[0]);
            break;
        } else if (typeof node === 'object') {
            const nextKey = Object.keys(node)[0];
            result.push(nextKey);
            node = node[nextKey];
        } else {
            break;
        }
    }
    return result;
}

$(document).ready(fetchLivePuzzle);
</script>
</body>
</html>
