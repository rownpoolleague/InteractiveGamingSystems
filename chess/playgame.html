<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Engine Analysis</title>
</head>
<body style="margin: 0; background: #161512;">

    <div id="wrapper" style="width: 100vw; height: 100vh;">
        <!-- This iframe loads the engine-powered board -->
        <iframe 
            id="engine-frame"
            style="width: 100%; height: 100%; border: none;"
            src="https://play.chessbase.com/en/play?fen=rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
        </iframe>
    </div>

    <script>
        window.addEventListener('load', () => {
            const savedPgn = sessionStorage.getItem('pendingPgn');
            if (savedPgn) {
                // You can pass the PGN here. Note: ChessBase expects a URL-encoded PGN
                const frame = document.getElementById('engine-frame');
                // Construct the URL with your PGN
                const baseUrl = "https://play.chessbase.com/en/play?pgn=";
                frame.src = baseUrl + encodeURIComponent(savedPgn);
            }
        });
    </script>
</body>
</html>
