<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        iframe {
            width: 100%;
            /* Change this value to adjust height. 
               Lowering 500px will make it shorter. */
            height: 600px; 
            border: 0;
        }
        button {
            margin: 20px 0;
            padding: 12px 24px;
            background-color: #444;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <iframe src="https://lichess.org/embed/analysis" frameborder="0"></iframe>
    <button onclick="window.location.href='index.html'">Menu</button>

</body>
</html>
