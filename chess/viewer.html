<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGN File Viewer - Dark Theme</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background-color: #1a1a1a; 
            color: #ffffff; 
        }

        .upload-section { margin-bottom: 20px; }

        .viewer-container { 
            width: 100%; 
            max-width: 400px; 
            aspect-ratio: 0.575; 
            border: 2px solid #444; 
            background-color: #000000; 
            padding: 5px; 
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }
    </style>
</head>
<body>

    <div class="viewer-container">
        <iframe name="cwvif_tfvswf" style='width:100%;height:100%;border:0'></iframe>
        <form id="cwvfm_tfvswf" method="post" action='https://caissa.com/bin/gameview' target="cwvif_tfvswf">
            <input id="cwvip_tfvswf" name="edat" type="hidden">
        </form>
    </div>

    <div class="upload-section">
        <label for="pgnFile">Select PGN File:</label>
        <input type="file" id="pgnFile" accept=".pgn,.txt">
    </div>

    <script>
        // Default PGN to show on load (empty board)
        const defaultPGN = "[Event \"Empty Board\"]\n[Site \"?\"]\n[Date \"?\"]\n[Round \"?\"]\n[White \"?\"]\n[Black \"?\"]\n[Result \"*\"]\n\n*";

        // Function to load PGN into the iframe
        function loadPGN(pgnData) {
            document.getElementById('cwvip_tfvswf').value = pgnData;
            document.getElementById('cwvfm_tfvswf').submit();
        }

        // On window load, show the default board
        window.onload = function() {
            loadPGN(defaultPGN);
        };

        // Handle file selection
        document.getElementById('pgnFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                loadPGN(event.target.result);
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
