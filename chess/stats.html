<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>League Stats Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 20px; 
            background-color: #000000; 
            color: #ffffff; 
        }
        h2 { color: #ffffff; border-bottom: 2px solid #f39c12; padding-bottom: 10px; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        select { 
            background-color: #111; 
            color: white; 
            border: 1px solid #333; 
            padding: 10px; 
            border-radius: 8px;
            font-size: 16px;
        }
        .stat-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
        }
        .stat-box { 
            background: #111; 
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 1.2em;
            color: #e0e0e0;
        }
        .stat-value { 
            color: #1e90ff; 
            font-weight: bold; 
            font-size: 1.25em;
        }
    </style>
</head>
<body>

    <h2>League Stats Dashboard</h2>
    <div class="controls">
        <select id="playerFilter"><option value="">Select Player</option></select>
        <select id="openingFilter"><option value="">All Openings</option></select>
        <select id="opponentFilter"><option value="">Select Opponent</option></select>
        <select id="colorFilter">
            <option value="">All Colors</option>
            <option value="White">White</option>
            <option value="Black">Black</option>
        </select>
    </div>

    <div class="stat-container">
        <div class="stat-box">Total Games: <span id="gameCount" class="stat-value">0</span></div>
        <div class="stat-box">Lifetime Record: <span id="recordDisplay" class="stat-value">0-0-0</span></div>
        <div class="stat-box">Win %: <span id="winPercent" class="stat-value">0</span>%</div>
    </div>

    <script>
        let matchData = [];
        const memberUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSiSgB9rf7i6bHLJn7_QLI8sBIBPWWV0WSQgWb867bIu_PHMOxxiuXD93Qrg1Kb5IuZd4BzkzMmfQnJ/pub?gid=0&single=true&output=csv";
        const matchUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSiSgB9rf7i6bHLJn7_QLI8sBIBPWWV0WSQgWb867bIu_PHMOxxiuXD93Qrg1Kb5IuZd4BzkzMmfQnJ/pub?gid=1304642458&single=true&output=csv";

        async function loadData() {
            const [memberRes, matchRes] = await Promise.all([fetch(memberUrl), fetch(matchUrl)]);
            const memberText = await memberRes.text();
            const matchText = await matchRes.text();
            
            const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
            const members = memberText.split('\n').slice(1).map(r => r.split(regex)[0].replace(/^"|"$/g, '').trim()).filter(n => n);
            matchData = matchText.split('\n').slice(1).map(row => 
                row.split(regex).map(cell => cell.replace(/^"|"$/g, '').trim())
            );
            
            populateFilters(members);
        }

        function populateFilters(members) {
            const pSelect = document.getElementById('playerFilter');
            const oSelect = document.getElementById('opponentFilter');
            const opSelect = document.getElementById('openingFilter');
            const openings = new Set(matchData.map(r => r[6]).filter(n => n));

            members.forEach(m => {
                pSelect.innerHTML += `<option value="${m}">${m}</option>`;
                oSelect.innerHTML += `<option value="${m}">${m}</option>`;
            });
            openings.forEach(o => opSelect.innerHTML += `<option value="${o}">${o}</option>`);
            document.querySelectorAll('select').forEach(el => el.addEventListener('change', calculateStats));
        }

        function calculateStats() {
            const p = document.getElementById('playerFilter').value;
            const o = document.getElementById('openingFilter').value;
            const opp = document.getElementById('opponentFilter').value;
            const c = document.getElementById('colorFilter').value;

            if(!p) {
                document.getElementById('gameCount').innerText = 0;
                document.getElementById('recordDisplay').innerText = "0-0-0";
                document.getElementById('winPercent').innerText = 0;
                return;
            }

            let wins = 0, losses = 0, draws = 0;

            matchData.forEach(row => {
                if (row.length < 8) return;
                
                const white = row[4], black = row[5], opening = row[6], result = row[7];
                
                let isMatch = false;
                let outcome = null;

                if ((c === "" || c === "White") && white === p) {
                    isMatch = true;
                    if(result === "1-0") outcome = "win";
                    else if(result === "0-1") outcome = "loss";
                    else if(result === "0.5-0.5") outcome = "draw";
                } else if ((c === "" || c === "Black") && black === p) {
                    isMatch = true;
                    if(result === "0-1") outcome = "win";
                    else if(result === "1-0") outcome = "loss";
                    else if(result === "0.5-0.5") outcome = "draw";
                }

                if (isMatch) {
                    if (o !== "" && opening !== o) isMatch = false;
                    if (opp !== "" && !((white === p && black === opp) || (black === p && white === opp))) isMatch = false;
                }

                if (isMatch && outcome) {
                    if (outcome === "win") wins++;
                    else if (outcome === "loss") losses++;
                    else if (outcome === "draw") draws++;
                }
            });

            const total = wins + losses + draws;
            const percent = total > 0 ? ((wins / total) * 100).toFixed(1) : 0;
            
            document.getElementById('gameCount').innerText = total;
            document.getElementById('recordDisplay').innerText = `${wins}-${losses}-${draws}`;
            document.getElementById('winPercent').innerText = percent;
        }

        loadData();
    </script>
</body>
</html>
