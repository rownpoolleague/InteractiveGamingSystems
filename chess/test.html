<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chess Viewer</title>

  <script src="https://dia.chessbase.com/Dia.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #viewer {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
    }

    #uploadBtn {
      margin-top: 15px;
      padding: 10px 20px;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    #uploadBtn:active {
      background: #666;
    }
  </style>
</head>

<body>

  <button id="uploadBtn">Load PGN</button>
  <input type="file" id="fileInput" accept=".pgn" style="display:none">

  <div id="viewer"></div>

  <script>
    let viewer = null;

    function loadPGN(pgnText) {
      viewer = CB.PgnViewer({
        id: "viewer",
        layout: "left",
        movesWidth: 220,
        engine: true,
        pieceStyle: "cb",
        pgn: pgnText
      });
    }

    // Default empty viewer
    loadPGN("[Event \"PGN Viewer\"] *");

    // Button triggers file picker
    document.getElementById("uploadBtn").onclick = () => {
      document.getElementById("fileInput").click();
    };

    // Load PGN from phone
    document.getElementById("fileInput").addEventListener("change", function() {
      const file = this.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        loadPGN(e.target.result);
      };
      reader.readAsText(file);
    });
  </script>

</body>
</html>
