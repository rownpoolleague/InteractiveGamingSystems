<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess News</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #eee;
        margin: 0;
        padding: 0;
    }

    header {
        background: #000;
        padding: 24px;
        text-align: center;
        font-size: 32px;
        font-weight: bold;
        border-bottom: 2px solid #1e90ff;
        letter-spacing: 1px;
    }

    .section-title {
        font-size: 24px;
        margin: 25px 15px 10px 15px;
        border-left: 5px solid #ffd700;
        padding-left: 12px;
    }

    .news-box {
        background: #1b1b1b;
        margin: 15px;
        padding: 18px;
        border-radius: 10px;
        border: 1px solid #333;
    }

    .news-item {
        margin-bottom: 22px;
        padding-bottom: 14px;
        border-bottom: 1px solid #333;
    }

    .news-item:last-child {
        border-bottom: none;
    }

    .news-title {
        font-size: 20px;
        font-weight: bold;
        color: #1e90ff;
        margin-bottom: 6px;
    }

    .news-date {
        font-size: 13px;
        color: #aaa;
        margin-bottom: 8px;
    }

    .news-body {
        font-size: 17px;
        line-height: 1.5;
    }

    .news-body img {
        max-width: 100%;
        border-radius: 6px;
        margin-top: 12px;
    }

    .news-body iframe {
        width: 100%;
        height: 320px;
        border: none;
        margin-top: 12px;
        border-radius: 6px;
    }

    .read-more {
        display: inline-block;
        margin-top: 12px;
        padding: 8px 14px;
        background: #1e90ff;
        color: #fff;
        border-radius: 6px;
        text-decoration: none;
        font-size: 15px;
    }

    .read-more:hover {
        background: #3aa0ff;
    }

    .back-button {
        display: block;
        margin: 40px auto;
        padding: 10px 18px;
        background-color: #1e90ff;
        color: #fff;
        border-radius: 6px;
        text-decoration: none;
        font-size: 24px;
        text-align: center;
        width: 260px;
    }

    /* Modal Viewer */
    #modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        z-index: 9999;
        padding: 10px;
        overflow-y: auto;
    }

    #modal-content {
        background: #1b1b1b;
        padding: 20px;
        border-radius: 10px;
        max-width: 95%;
        margin: auto;
        color: #eee;
    }

    #modal-close {
        background: #1e90ff;
        padding: 10px 16px;
        border-radius: 6px;
        color: #fff;
        float: right;
        cursor: pointer;
        margin-bottom: 10px;
        font-size: 16px;
    }
</style>
</head>

<body>

<header>Chess News</header>
<div class="section-title">Club News</div>


<div class="section-title">Latest Chess.com News</div>
<div class="news-box" id="chessNews">Loading chess news...</div>

<a class="back-button" href="index.html">Main Menu</a>

<!-- Modal Viewer -->
<div id="modal">
    <div id="modal-content">
        <div id="modal-close">Close</div>
        <div id="modal-body"></div>
    </div>
</div>

<script>
async function loadChessNews() {
    const feed = "https://www.chess.com/rss/news";
    const url = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feed);

    const container = document.getElementById("chessNews");
    container.innerHTML = "Loading chess news...";

    try {
        const res = await fetch(url);
        const data = await res.json();

        container.innerHTML = "";

        data.items.slice(0, 20).forEach(item => {
            const div = document.createElement("div");
            div.className = "news-item";

            div.innerHTML = `
                <div class="news-title">${item.title}</div>
                <div class="news-date">${item.pubDate}</div>
                <div class="news-body">${item.description}</div>
                <a class="read-more" onclick="openModal('${encodeURIComponent(item.link)}')">Open</a>
            `;

            container.appendChild(div);
        });

    } catch (err) {
        container.innerHTML = "Unable to load chess news.";
    }
}

function openModal(url) {
    const modal = document.getElementById("modal");
    const body = document.getElementById("modal-body");

    modal.style.display = "block";
    body.innerHTML = `<iframe src="${decodeURIComponent(url)}" style="width:100%;height:80vh;border:none;"></iframe>`;
}

document.getElementById("modal-close").onclick = function() {
    document.getElementById("modal").style.display = "none";
};

loadChessNews();
</script>

</body>
</html>
