<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/chess/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Club Main Menu</title>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: Arial, sans-serif;
            background-color: #000000; color: white;
        }

        .overlay {
            display: flex; flex-direction: column;
            justify-content: center; padding: 20px 10px;
        }
        h1 { text-align: center; margin-bottom: 20px; font-size: 32px; }
.spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-left: 8px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.menu-button[disabled] {
    opacity: 0.6;
    cursor: not-allowed;
}

        .link-card {
            max-width: 500px;
            margin: 0 auto;
            width: 90%;
            background: #111;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .menu-container {
            display: flex; flex-direction: column; gap: 15px;
        }

        .menu-button {
            display: block; text-align: center; padding: 10px; 
            background: #1e90ff; color: white; text-decoration: none; 
            font-size: 20px; border-radius: 8px; font-weight: bold; 
            width: 100%; cursor: pointer; transition: background 0.2s;
            border: none;
        }
        .menu-button:hover { background: #187bcd; }

        footer { text-align: center; padding: 20px; }
        .footer-logo { max-width: 150px; opacity: 0.8; }
        .powered-by {
        display: block;
        margin-top: 10px;
        color: #1e90ff; /* Electric Blue */
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: bold;
        text-shadow: 0 0 8px rgba(30, 144, 255, 0.5); /* Adds a subtle glow */
    }
    .powered-by:hover {
        text-decoration: underline;
    }
    </style>
</head>

<body>

    <!-- ADMIN MODAL -->
    <div id="adminModal" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:9999;">
        <div style="background:#111; padding:30px; border-radius:10px; width:300px; border:2px solid #1e90ff; text-align:center;">
            <h2 style="color:white; margin-top:0;">Admin Login</h2>
            <input id="adminPass" type="password" placeholder="Password" style="width:100%; padding:10px; font-size:18px; margin-bottom:20px;">
            <button onclick="submitAdminPassword()" style="width:100%; padding:10px; font-size:20px; background:#1e90ff; color:white; border:none; border-radius:6px;">Enter</button>
        </div>
    </div>

    <!-- MAIN MENU -->
    <div class="overlay">
        <h1>Main Menu</h1>
        
        <div class="link-card">
            <div class="menu-container">
                <a class="menu-button" href="calendar.html" onclick="goTo(event, this.href)">Calendar</a>
                <a class="menu-button" href="members.html" onclick="goTo(event, this.href)">SSCC Members</a>
                <a class="menu-button" href="tournamentdata.html" onclick="goTo(event, this.href)">Pairings/Results</a>
                <a class="menu-button" href="clock.html" onclick="goTo(event, this.href)">Clock</a>
                <a class="menu-button" href="submit.html" onclick="goTo(event, this.href)">Submit a Club Game</a>
                <a class="menu-button" href="viewer.html" onclick="goTo(event, this.href)">Load PGN</a>
                <a class="menu-button" href="admin.html" onclick="goTo(event, this.href, true)">Admin</a>
                <button id="notifyBtn" class="menu-button" onclick="enableNotifications()">Enable Notifications</button>

            </div>
        </div>
    </div>

    <footer>
        <img src="iconking.png" alt="Club Logo" class="footer-logo">
        <a href="https://interactivegamingsystems.app" class="powered-by">Powered by Interactive Gaming Systems</a>
    </footer>

<!-- FIREBASE + NOTIFICATION LOGIC (v8 ONLY) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>

<script>
  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyBek60G1Ns_PVhODcp02H0S2jryhdUKFuQ",
    authDomain: "sscc-push.firebaseapp.com",
    projectId: "sscc-push",
    storageBucket: "sscc-push.firebasestorage.app",
    messagingSenderId: "954838466310",
    appId: "1:954838466310:web:d7ba03562b6c0b8db66887"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);

  // Register service worker FIRST and create ONE messaging instance
  navigator.serviceWorker.register('sw.js')
    .then((reg) => {
      console.log('Service Worker ready');

      const messaging = firebase.messaging();   // REQUIRED
      messaging.useServiceWorker(reg);

      window.messaging = messaging;             // REQUIRED
    })
    .catch((err) => alert("SW Registration failed: " + err));

  // Enable notifications
window.enableNotifications = async () => {
    const btn = document.getElementById("notifyBtn");
    if (!btn) return;

    // If already disabled, ignore extra clicks
    if (btn.disabled) return;

    // Lock button + show spinner
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = "Enabling...";
    const spinner = document.createElement("span");
    spinner.className = "spinner";
    btn.appendChild(spinner);

    try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
            alert("Permission denied.");
            return;
        }

        const swReg = await navigator.serviceWorker.ready;

        const token = await window.messaging.getToken({
            vapidKey: "BAvXMdABPFn8frEfnMHIN00x5VImnSdUK4YTKUqc_V5ffdl-kDjisn_n1ePSzl_HP2H1KxJs6O7KnwbFPoiy03Y",
            serviceWorkerRegistration: swReg
        });

        console.log("FCM TOKEN:", token);

        if (!token) {
            alert("Failed to get token.");
            return;
        }

        await fetch("https://script.google.com/macros/s/AKfycbyYoNPnldbTbvP3Qdlr5hZUrFK2opVtf3aZxuDcZzwun64Rhlc54MnYHxLmcq3kNCk/exec", {
            method: "POST",
            mode: "cors",
            cache: "no-store",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            signal: AbortSignal.timeout(8000),
            body: `action=saveToken&token=${encodeURIComponent(token)}`
        })
        .then(r => r.text())
        .then(t => {
            if (!t.trim() || t.trim().startsWith("<")) {
                throw new Error("Invalid response from Apps Script");
            }
            alert("Notifications Enabled!");
            // Optional: keep button disabled and change label
            btn.textContent = "Notifications Enabled";
        });

    } catch (err) {
        alert("Token error: " + err);
        console.error(err);
    } finally {
        // If we didn't change the label to a final state, restore it
        if (btn.textContent === "Enabling...") {
            btn.textContent = originalText;
            btn.disabled = false;
        }
    }
};



  /* ADMIN + NAVIGATION */
  function goTo(event, url, isAdmin = false) {
      event.preventDefault();
      if (isAdmin) {
          const modal = document.getElementById("adminModal");
          modal.style.display = "flex";
          modal.dataset.url = url;
          return;
      }
      window.location.href = url;
  }

 async function submitAdminPassword() {
    const pass = document.getElementById("adminPass").value.trim();
    if (!pass) return;

    try {
        const resp = await fetch(
            "https://script.google.com/macros/s/AKfycbyYoNPnldbTbvP3Qdlr5hZUrFK2opVtf3aZxuDcZzwun64Rhlc54MnYHxLmcq3kNCk/exec",
            {
                method: "POST",
                mode: "cors",
                cache: "no-store",
                signal: AbortSignal.timeout(8000),
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `action=checkAdminPassword&password=${encodeURIComponent(pass)}`
            }
        );

        const text = await resp.text();

        // Detect HTML or empty response (Apps Script error page)
        if (!text.trim() || text.trim().startsWith("<")) {
            throw new Error("Invalid response from Apps Script");
        }

        const data = JSON.parse(text);

        if (!data.ok) {
            alert("Incorrect password.");
            return;
        }

        sessionStorage.setItem("adminAuth", "ok");
        window.location.href = document.getElementById("adminModal").dataset.url;

    } catch (err) {
        console.error("Admin password error:", err);
        alert("Error checking password. Try again.");
    }
}

</script>

</body>
</html>
