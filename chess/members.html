<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SSCC MEMBERS</title>
    <style>
        :root { --bg: #000; --card: #111; --accent: #3b82f6; --text: #eee; }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; background-color: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;overscroll-behavior-y: none; }
        .form-wrapper { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100dvh; border: 4px solid #1e90ff; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; padding: env(safe-area-inset-top, 4px) env(safe-area-inset-right, 4px) env(safe-area-inset-bottom, 4px) env(safe-area-inset-left, 4px); }
        .engine-box { flex: 1; background: var(--bg); padding: 15px; display: flex; flex-direction: column; overflow-y: auto;-webkit-overflow-scrolling: touch;
    overscroll-behavior: contain; }
        header { padding-bottom: 12px; border-bottom: 1px solid #222; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.2rem; color: var(--accent); }
        .nav-button { background: #1e90ff; color: white; text-decoration: none; font-size: 0.9rem; font-weight: bold; padding: 6px 12px; border-radius: 4px; }
        #player-list-container { display: flex; flex-direction: column; gap: 5px; width: 100%; }
        .player-row { background: #0a0a0a; padding: 15px; border-bottom: 1px solid #222; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
        .player-name { font-weight: bold; font-size: 1rem; color: var(--text); display: flex; align-items: center; }
        .player-stats { font-size: 0.75rem; color: #888; text-align: right; }
        .loading-container { text-align: center; margin-top: 50px; font-size: 24px; color: #555; }
    </style>
</head>
<body>

<div id="profile-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:100; padding:20px; overflow-y:auto; color: white;">
    <div style="background:#1a1a1a; padding:20px; border-radius:8px; border:1px solid #444; max-width: 500px; margin: auto;">
        <h2 id="modal-player-name" style="color:var(--accent); display: flex; align-items: center;"></h2>
        <div id="modal-ratings" style="margin-bottom:15px; font-size: 0.9rem;"></div>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<div class="form-wrapper">
    <div class="engine-box">
        <header>
            <h1>SSCC MEMBERS</h1>
            <a class="nav-button" href="index.html">Main Menu</a>
        </header>
        <div id="player-list-container">
            <div class="loading-container">Loading...</div>
        </div>
    </div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSiSgB9rf7i6bHLJn7_QLI8sBIBPWWV0WSQgWb867bIu_PHMOxxiuXD93Qrg1Kb5IuZd4BzkzMmfQnJ/pub?output=csv";

function getPhotoPath(name) { return `photos/${name.replace(',', '').trim()}.jpg`; }

function parseCSV(text) {
    const lines = text.split('\n');
    const result = [];
    // Skip header and iterate
    for(let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if(!line) continue;
        
        // This regex splits by comma ONLY if it's NOT inside quotes
        // Google Sheets publishes names with commas as "Last, First"
        const row = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g).map(s => s.replace(/"/g, '').trim());
        
        if(row.length >= 4) {
            result.push({ name: row[0], reg: row[1], quick: row[2], blitz: row[3] });
        }
    }
    return result;
}

async function loadPlayers() {
    const container = document.getElementById('player-list-container');
    try {
        const resp = await fetch(CSV_URL);
        const text = await resp.text();
        const players = parseCSV(text);

        container.innerHTML = players.map(p => `
            <div class="player-row" onclick="showProfile('${p.name.replace(/'/g, "\\'")}', '${p.reg}', '${p.quick}', '${p.blitz}')">
                <div class="player-name">
                    <img src="${getPhotoPath(p.name)}" onerror="this.style.display='none'" style="width:40px; height:40px; border-radius:50%; margin-right:15px;">
                    ${p.name}
                </div>
                <div class="player-stats">Reg: ${p.reg} | Q: ${p.quick} | B: ${p.blitz}</div>
            </div>`).join('');
    } catch (e) {
        container.innerHTML = '<div style="color:red;">Failed to load data.</div>';
    }
}

function showProfile(name, reg, quick, blitz) {
    const modal = document.getElementById('profile-modal');
    const nameEl = document.getElementById('modal-player-name');
    const ratingsEl = document.getElementById('modal-ratings');

    const photoPath = getPhotoPath(name);   // <-- real path, no placeholder

    const img = new Image();                // <-- real browser image object
    img.src = photoPath;                    // <-- tries to load actual file

    img.onload = () => {
        // Photo exists → show it
        nameEl.innerHTML = `
            <img src="${photoPath}"
                 style="width:80px; height:80px; border-radius:50%; object-fit:cover; margin-right:15px; border:2px solid var(--accent);">
            ${name}
        `;
    };

    img.onerror = () => {
        // Photo missing → show name only
        nameEl.innerText = name;
    };

    ratingsEl.innerText = `Reg: ${reg} | Quick: ${quick} | Blitz: ${blitz}`;
    modal.style.display = 'block';
}


function closeModal() { document.getElementById('profile-modal').style.display = 'none'; }

window.onload = loadPlayers;
</script>
</body>
</html>
