<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mliebelt/pgn-viewer/lib/pgn-viewer.min.css">
</head>
<body>
    <div id="board" style="width: 100%; height: 100vh;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@mliebelt/pgn-viewer/lib/pgn-viewer.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Get the PGN from session memory
            const pgn = sessionStorage.getItem('pendingPgn');

            if (pgn) {
                pgnv.pgnView("board", {
                    pgn: pgn,
                    pieceStyle: 'merida',
                    theme: 'blue'
                });
                // Optional: Clear it so it doesn't reload if refreshed
                sessionStorage.removeItem('pendingPgn');
            } else {
                document.getElementById('board').innerText = "No game data found. Please open from the dashboard.";
            }
        });
    </script>
</body>
</html>
