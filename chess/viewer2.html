<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Analysis</title>
    <!-- CSS for the viewer -->
    <link href="https://c2a.chesstempo.com/pgnviewer/v2.5/pgnviewerext.vers1.css" media="all" rel="stylesheet" crossorigin>
    <!-- Fonts for the board -->
    <link href="https://c1a.chesstempo.com/fonts/MaterialIcons-Regular.woff2" rel="stylesheet" crossorigin>
    <style>
        body { background: #161512; padding: 20px; font-family: sans-serif; }
        .board-container { max-width: 600px; margin: 0 auto; }
    </style>
</head>
<body>
    <div id="wrapper" style="max-width: 600px; margin: 20px auto;">
        <!-- The board will be injected here -->
    </div>

    <script>
        window.addEventListener('load', () => {
            const savedPgn = sessionStorage.getItem('pendingPgn');
            const wrapper = document.getElementById('wrapper');

            if (savedPgn) {
                // Create the element dynamically so it is forced to read the new PGN
                const viewer = document.createElement('ct-pgn-viewer');
                viewer.id = 'my-board';
                // Set the PGN directly as content
                viewer.textContent = savedPgn;
                wrapper.appendChild(viewer);
            } else {
                wrapper.innerHTML = "<h2 style='color:white'>No game data found. Go back and click a game.</h2>";
            }
        });
    </script>
    
    <!-- The viewer engine -->
    <script defer src="https://c1a.chesstempo.com/pgnviewer/v2.5/pgnviewerext.bundle.vers1.js" crossorigin></script>
</body>
</html>
