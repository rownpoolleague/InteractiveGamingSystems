<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Analysis Viewer</title>
    
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            background-color: #000000; font-family: sans-serif;
            color: white; display: flex; flex-direction: column; overflow: hidden;
        }
        .page-wrapper {
            flex: 1; display: flex; flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .iframe-container { width: 100%; flex-grow: 1; position: relative; }
        .iframe-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
        .control-area {
            width: 100%; background-color: #1a1a1a; padding: 20px 0;
            display: flex; flex-direction: column; align-items: center;
        }
        button.menu-button {
            padding: 12px 24px; background: #1e90ff; color: #fff;
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="iframe-container">
            <!-- The src will be updated by the script below -->
            <iframe id="lichessFrame" src="https://lichess.org/embed/analysis" frameborder="0" allowfullscreen></iframe>
        </div>

        <div class="control-area">
            <button class="menu-button" onclick="window.location.href='index.html'">Back to Dashboard</button>
        </div>
    </div>

<script>
    window.addEventListener('load', () => {
        // Get the PGN from the URL hash (e.g., #pgn=...)
        const hash = window.location.hash;
        if (hash.includes('pgn=')) {
            const pgn = decodeURIComponent(hash.split('pgn=')[1]);
            const iframe = document.querySelector('.iframe-container iframe');
            
            // Reconstruct the src with the PGN in the Lichess expected format
            iframe.src = `https://lichess.org/embed/analysis#${hash.substring(1)}`;
        }
    });
</script>

</body>
</html>
