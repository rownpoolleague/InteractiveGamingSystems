<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local PGN Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        #myBoard { width: 400px; margin: 20px auto; }
        #move-list { width: 400px; height: 150px; margin: 20px auto; overflow-y: auto; border: 1px solid #ccc; padding: 10px; font-family: monospace; }
        .move-item { cursor: pointer; padding: 2px 5px; display: inline-block; }
        .move-item:hover { background: #eee; }
        .active-move { background: #007bff; color: white; }
        
        #battle-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        #sword-fight { font-size: 5rem; opacity: 0; }
        
        @keyframes fight {
            0% { opacity: 0; transform: scale(0.5) rotate(-20deg); }
            20% { opacity: 1; transform: scale(1.2) rotate(20deg); }
            80% { opacity: 1; transform: scale(1.2) rotate(-20deg); }
            100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
        }
        .animate-fight { animation: fight 0.8s ease-in-out; }
    </style>
</head>
<body>

    <div style="position: relative;">
        <div id="myBoard"></div>
        <div id="battle-overlay">
            <div id="sword-fight">⚔️</div>
        </div>
    </div>

    <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
        <button onclick="nav('start')">⏮</button>
        <button onclick="nav('back')">◀</button>
        <button onclick="nav('forward')">▶</button>
        <button onclick="nav('end')">⏭</button>
    </div>

    <div id="move-list"></div>

    <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
        <input type="file" id="pgn-file" accept=".pgn" style="display: none;" onchange="handleFileSelect(event)">
        <button onclick="document.getElementById('pgn-file').click()">Load PGN</button>
        <button onclick="alert(game.pgn())">Copy PGN</button>
    </div>

<script>
    var game = new Chess();
    const sword = document.getElementById('sword-fight');
    const moveListDiv = document.getElementById('move-list');
    let moveIndex = -1;

    var config = {
        draggable: true,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDrop: function(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            if (move.flags.includes('c')) {
                sword.classList.add('animate-fight');
                setTimeout(() => sword.classList.remove('animate-fight'), 800);
            }
            updateMoveList();
            board.position(game.fen());
        }
    };

    var board = Chessboard('myBoard', config);

    function updateMoveList() {
        const history = game.history({ verbose: true });
        moveListDiv.innerHTML = '';
        for (let i = 0; i < history.length; i += 2) {
            const turnNumber = (i / 2) + 1;
            const turnWrapper = document.createElement('div');
            turnWrapper.style.marginBottom = '5px';
            
            const label = document.createElement('span');
            label.innerText = turnNumber + ". ";
            label.style.color = '#888';
            turnWrapper.appendChild(label);
            
            const whiteMove = document.createElement('span');
            whiteMove.innerText = history[i].san + " ";
            whiteMove.className = 'move-item' + (i === moveIndex ? ' active-move' : '');
            whiteMove.onclick = () => { moveIndex = i; updateBoard(); };
            turnWrapper.appendChild(whiteMove);
            
            if (history[i + 1]) {
                const blackMove = document.createElement('span');
                blackMove.innerText = history[i + 1].san + " ";
                blackMove.className = 'move-item' + ((i + 1) === moveIndex ? ' active-move' : '');
                blackMove.onclick = () => { moveIndex = i + 1; updateBoard(); };
                turnWrapper.appendChild(blackMove);
            }
            moveListDiv.appendChild(turnWrapper);
        }
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            if (game.load_pgn(e.target.result)) {
                moveIndex = -1;
                board.position('start');
                updateMoveList();
            } else {
                alert("Invalid PGN");
            }
        };
        reader.readAsText(file);
    }

    function updateBoard() {
        const history = game.history({ verbose: true });
        if (moveIndex === -1) {
            board.position('start');
        } else {
            let tempGame = new Chess();
            for (let i = 0; i <= moveIndex; i++) {
                tempGame.move(history[i]);
            }
            board.position(tempGame.fen());
        }
        updateMoveList();
    }

    function nav(direction) {
        const history = game.history({ verbose: true });
        if (direction === 'start') moveIndex = -1;
        else if (direction === 'back' && moveIndex >= 0) moveIndex--;
        else if (direction === 'forward' && moveIndex < history.length - 1) moveIndex++;
        else if (direction === 'end') moveIndex = history.length - 1;
        updateBoard();
    }
</script>
</body>
</html>
