<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mliebelt/pgn-viewer/lib/pgn-viewer.min.css">
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #161512; color: white; }
        #board { width: 100%; max-width: 800px; margin: 0 auto; }
    </style>
</head>
<body>

    <div id="board"></div>

    <script src="https://cdn.jsdelivr.net/npm/@mliebelt/pgn-viewer/lib/pgn-viewer.min.js"></script>
    <script>
        window.addEventListener('load', () => {
            const pgn = sessionStorage.getItem('pendingPgn');
            console.log("PGN retrieved from storage:", pgn ? "Success" : "Failed");

            if (pgn && typeof pgnv !== 'undefined') {
                try {
                    pgnv.pgnView("board", {
                        pgn: pgn,
                        pieceStyle: 'merida',
                        theme: 'blue',
                        layout: 'top'
                    });
                } catch (e) {
                    console.error("PGNViewer failed to render:", e);
                    document.getElementById('board').innerText = "Error rendering game: " + e.message;
                }
            } else {
                document.getElementById('board').innerText = "No game data found or library failed to load.";
            }
        });
    </script>
</body>
</html>
